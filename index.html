<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0616" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Schibsted+Grotesk:wght@400..600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://anotherdev.in/" />
    <title>AnotherDev - Shoppable Video for Shopify: Watch, tap, buy</title>
    <meta name="description" content="Turn your reels into a shoppable storefront. Add video galleries, product carousels and a floating player to any page. Add to cart inside the video." />

    <!-- Open Graph fallback (per-page tags are injected by React Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnotherDev" />
    <meta property="og:title" content="AnotherDev - Shoppable Video for Shopify" />
    <meta property="og:description" content="Turn your reels into a shoppable storefront. Add video galleries, product carousels and a floating player to any page. Add to cart inside the video." />
    <meta property="og:url" content="https://anotherdev.in/" />
    <meta property="og:image" content="https://anotherdev.in/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AnotherDev",
      "url": "https://anotherdev.in",
      "logo": "https://anotherdev.in/logo.svg",
      "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "url": "https://anotherdev.in/support" },
      "sameAs": ["https://apps.shopify.com/another-shoppable-video-app"],
      "makesOffer": {
        "@type": "Offer",
        "itemOffered": {
          "@type": "SoftwareApplication",
          "name": "AnotherDev - Shoppable Video",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Shopify"
        }
      }
    }
    </script>

    <!-- WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AnotherDev",
      "alternateName": "AnotherDev - Shoppable Video for Shopify",
      "url": "https://anotherdev.in",
      "publisher": { "@type": "Organization", "name": "AnotherDev", "url": "https://anotherdev.in" }
    }
    </script>
    <noscript>
      <style>.reveal { opacity: 1 !important; animation: none !important; }</style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
